[build]
  base = "client"
  command = "npm install --include=dev && npm run build"
  publish = "dist"
  functions = "client/functions"

[build.environment]
  NPM_FLAGS = "--include=dev"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
